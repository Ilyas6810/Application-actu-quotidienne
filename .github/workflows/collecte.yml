name: Collecte et alertes

on:
  schedule:
    - cron: "17 */3 * * *"   # toutes les 3 heures, à la 17e minute (le début d'heure est engorgé)
  workflow_dispatch:

concurrency:
  group: pipeline            # partagé avec l'édition : jamais deux passages en même temps
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Dépendances
        run: pip install -r pipeline/requirements.txt

      - name: Restaurer l'état (pool des 72 dernières heures)
        uses: actions/cache/restore@v6
        with:
          path: pipeline/etat
          key: etat-${{ github.run_id }}
          restore-keys: etat-

      - name: Modèle de vecteurs multilingues (téléchargé une seule fois)
        uses: actions/cache@v6
        with:
          path: pipeline/modeles
          key: modele-paraphrase-multilingual-MiniLM-L12-v2

      - name: Identité Git du robot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Collecte, regroupement, alertes
        working-directory: pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          EXPO_PUSH_TOKEN: ${{ secrets.EXPO_PUSH_TOKEN }}
        run: |
          python collecte.py
          python cluster.py
          python alertes.py --commit

      - name: Sauver l'état
        if: always() && hashFiles('pipeline/etat/pool.json.gz') != ''
        uses: actions/cache/save@v6
        with:
          path: pipeline/etat
          key: etat-${{ github.run_id }}
