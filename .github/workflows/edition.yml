name: Édition du matin

on:
  schedule:
    - cron: "30 0 * * *"     # 00:30 UTC = 04:30 à La Réunion (UTC+4) : édition prête avant 6 h
  workflow_dispatch:
    inputs:
      limite:
        description: "Nombre maximal d'articles (vide = édition complète)"
        required: false
        default: ""

concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  edition:
    runs-on: ubuntu-latest
    timeout-minutes: 150     # démarrage parfois en retard + rédaction + attente de 6 h pour la notification
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Dépendances
        run: pip install -r pipeline/requirements.txt

      - name: Restaurer l'état (pool des 72 dernières heures)
        uses: actions/cache/restore@v6
        with:
          path: pipeline/etat
          key: etat-${{ github.run_id }}
          restore-keys: etat-

      - name: Modèle de vecteurs multilingues (téléchargé une seule fois)
        uses: actions/cache@v6
        with:
          path: pipeline/modeles
          key: modele-paraphrase-multilingual-MiniLM-L12-v2

      - name: Identité Git du robot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Édition
        working-directory: pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          EXPO_PUSH_TOKEN: ${{ secrets.EXPO_PUSH_TOKEN }}
          EVENEMENT: ${{ github.event_name }}
          LIMITE: ${{ inputs.limite }}
        run: |
          ARGS="--commit"
          # L'heure limite et la notification de 6 h ne valent que pour le passage planifié.
          if [ "$EVENEMENT" = "schedule" ]; then ARGS="$ARGS --heure-limite 05:45 --notifier-a 06:00"; fi
          if [[ "$LIMITE" =~ ^[0-9]+$ ]]; then ARGS="$ARGS --limite $LIMITE"; fi
          python edition.py $ARGS

      - name: Rapport dans le résumé du passage
        if: always()
        run: cat pipeline/etat/rapport_edition.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Sauver l'état
        if: always() && hashFiles('pipeline/etat/pool.json.gz') != ''
        uses: actions/cache/save@v6
        with:
          path: pipeline/etat
          key: etat-${{ github.run_id }}
