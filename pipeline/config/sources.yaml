# Sources suivies. Chaque flux a été testé le 2026-09-10 (code HTTP, fraîcheur, volume).
#
# Champs d'une source :
#   nom          nom affiché en pied d'article
#   groupe       propriétaire : deux sources du même groupe ne sont jamais indépendantes
#   pays         pays de la rédaction (bonus de diversité géographique)
#   langue       langue par défaut des flux (un flux peut la redéfinir)
#   type         presse | officiel | specialise
#   niveau       1 = compte comme source de vérification
#   sites        domaines web (reconnaissance des liens trouvés par GDELT et Wikipédia)
#   alias        noms repérés dans les textes d'autres sources (« selon la BBC ») ; par défaut : nom
#   competence   (officiels) rubriques où la source confirme seule un fait qui la concerne
#   titres_seuls le flux n'apporte que des titres
#   actif        false = source connue (liens reconnus) mais flux non lu
#   flux         liste de {url, rubrique} ; rubrique vide = flux généraliste

agences:
  # Les reprises de dépêches comptent pour une seule source : l'agence.
  # Motifs sensibles à la casse.
  - {nom: AFP, motifs: ['\bAFP\b', 'Agence France-Presse', 'Agence France Presse'], sites: [afp.com], pays: FR, langue: fr}
  - {nom: Reuters, motifs: ['\bReuters\b'], sites: [reuters.com], pays: GB}
  - {nom: Associated Press, motifs: ['Associated Press', '\(AP\)', '\bAP News\b'], sites: [apnews.com], pays: US}
  - {nom: dpa, motifs: ['\bdpa\b'], sites: [dpa.com], pays: DE, langue: de}
  - {nom: EFE, motifs: ['\bEFE\b'], sites: [efe.com], pays: ES, langue: es}
  - {nom: ANSA, motifs: ['\bANSA\b'], sites: [ansa.it], pays: IT, langue: it}
  - {nom: Europa Press, motifs: ['Europa Press'], sites: [europapress.es], pays: ES, langue: es}
  - {nom: PA Media, motifs: ['\bPA Media\b'], pays: GB}
  - {nom: Belga, motifs: ['\bBelga\b'], pays: BE}
  - {nom: Kyodo, motifs: ['\bKyodo\b'], sites: [kyodonews.net], pays: JP}
  - {nom: Xinhua, motifs: ['\bXinhua\b'], sites: [xinhuanet.com, news.cn], pays: CN}
  - {nom: Yonhap, motifs: ['\bYonhap\b'], sites: [yna.co.kr], pays: KR}
  - {nom: Anadolu, motifs: ['\bAnadolu\b'], sites: [aa.com.tr], pays: TR}
  - {nom: TASS, motifs: ['\bTASS\b', '\bTass\b'], sites: [tass.com, tass.ru], pays: RU}
  - {nom: Interfax, motifs: ['\bInterfax\b'], sites: [interfax.ru, interfax.com], pays: RU}
  - {nom: PTI, motifs: ['\bPTI\b', 'Press Trust of India'], pays: IN}
  - {nom: Lusa, motifs: ['\bLusa\b'], sites: [lusa.pt], pays: PT, langue: pt}

